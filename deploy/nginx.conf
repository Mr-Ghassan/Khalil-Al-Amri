# Static site server. TLS terminates at the platform proxy (Coolify/Traefik) in front of this container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  # Canonical host is www.khalilprop.com (canonical/hreflang/sitemap use it).
  if ($host = khalilprop.com) { return 301 https://www.khalilprop.com$request_uri; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;
  gzip_min_length 1024;

  error_page 404 /404.html;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* ^/(media|brand)/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html $uri/ =404;
  }
}
